<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellspring eCampus LMS | Sign In</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              DEFAULT: '#082c4c',
              dark: '#04172a',
              light: '#0d3d66'
            },
            blue: {
              DEFAULT: '#0879bd',
              light: '#38bdf8'
            },
            gold: {
              DEFAULT: '#e4b547',
              light: '#fef08a'
            },
            paper: '#f8f6f0'
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-paper text-gray-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 py-4 px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="landing.html" class="flex items-center gap-3">
        <img src="public/welsu-logo.png" alt="Wellspring Logo" class="h-10 w-auto object-contain" onError="this.onerror=null; this.src='https://via.placeholder.com/150x50?text=Wellspring+LMS';">
        <div>
          <span class="block font-bold text-navy text-base">Wellspring eCampus</span>
          <span class="block text-[10px] font-semibold text-blue uppercase">Official Portal Login</span>
        </div>
      </a>
      <a href="landing.html" class="text-xs font-bold text-navy hover:text-blue transition flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Landing Page
      </a>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl overflow-hidden border border-gray-100">
      <div class="bg-navy p-6 text-white relative">
        <div class="w-10 h-10 rounded-xl bg-gold/20 flex items-center justify-center text-gold font-bold mb-3">
          <i data-lucide="lock" class="w-5 h-5"></i>
        </div>
        <h2 class="font-bold text-2xl text-white">Sign In to LMS</h2>
        <p class="text-xs text-gray-300 mt-1">Enter your matriculation or staff credentials to access your dashboard.</p>
      </div>

      <div class="p-6">
        <!-- 1-Click Evaluation Shortcuts -->
        <div class="p-4 bg-blue-50 rounded-2xl border border-blue-100 mb-6">
          <p class="text-xs font-bold text-blue-900 mb-2">Instant Evaluation Quick Login:</p>
          <div class="grid grid-cols-2 gap-2">
            <button id="login-demo-student" class="py-2.5 px-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-1 shadow">
              <i data-lucide="user" class="w-3.5 h-3.5"></i> Demo Student
            </button>
            <button id="login-demo-faculty" class="py-2.5 px-3 bg-navy hover:bg-navy-light text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-1 shadow">
              <i data-lucide="award" class="w-3.5 h-3.5 text-gold"></i> Demo Lecturer
            </button>
          </div>
        </div>

        <form id="standalone-login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">User Account Type</label>
            <select id="login-role-select" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue focus:outline-none">
              <option value="student">Student (Matriculation Number)</option>
              <option value="faculty">Faculty / Academic Staff</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Email / Matric Number</label>
            <input type="text" id="login-email" value="e.okonjo@wellspringuniversity.edu.ng" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:ring-2 focus:ring-blue focus:outline-none" required>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Password</label>
            <input type="password" value="••••••••••••" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:ring-2 focus:ring-blue focus:outline-none" required>
          </div>

          <div class="flex items-center justify-between text-xs">
            <label class="flex items-center gap-2 cursor-pointer text-gray-600">
              <input type="checkbox" checked class="rounded text-blue-600 focus:ring-blue">
              Remember me
            </label>
            <a href="#" class="text-blue font-bold hover:underline">Forgot password?</a>
          </div>

          <button type="submit" class="w-full py-3.5 bg-navy hover:bg-navy-light text-white font-bold text-xs rounded-xl transition shadow-md flex items-center justify-center gap-2">
            <i data-lucide="log-in" class="w-4 h-4"></i> Sign In to Account
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
    &copy; 2026 Wellspring University. All rights reserved.
  </footer>

  <script src="js/data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();

      const urlParams = new URLSearchParams(window.location.search);
      const roleParam = urlParams.get("role");
      const roleSelect = document.getElementById("login-role-select");
      if (roleParam && roleSelect) {
        roleSelect.value = roleParam;
      }

      function doLogin(profile) {
        localStorage.setItem("welsu_lms_user", JSON.stringify(profile));
        if (profile.role === "faculty" || profile.role === "lecturer") {
          window.location.href = "lecturer-dashboard.html";
        } else {
          window.location.href = "student-dashboard.html";
        }
      }

      document.getElementById("login-demo-student")?.addEventListener("click", () => {
        doLogin(LMS_DATA.studentProfile);
      });

      document.getElementById("login-demo-faculty")?.addEventListener("click", () => {
        doLogin(LMS_DATA.facultyProfile);
      });

      document.getElementById("standalone-login-form")?.addEventListener("submit", (e) => {
        e.preventDefault();
        const role = roleSelect.value;
        const profile = role === "faculty" ? LMS_DATA.facultyProfile : LMS_DATA.studentProfile;
        doLogin(profile);
      });
    });
  </script>
</body>
</html>
