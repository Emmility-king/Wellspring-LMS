<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellspring LMS | Portal Router</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Smart Role-Based Router Script
    (function routeUser() {
      const savedUser = localStorage.getItem("welsu_lms_user");
      let user = null;
      if (savedUser) {
        try {
          user = JSON.parse(savedUser);
        } catch (e) {
          user = null;
        }
      }

      if (user && (user.role === "faculty" || user.role === "lecturer")) {
        window.location.replace("lecturer-dashboard.html");
      } else {
        window.location.replace("student-dashboard.html");
      }
    })();
  </script>
</head>
<body class="bg-[#082c4c] text-white antialiased min-h-screen flex items-center justify-center p-4">
  <div class="bg-white/10 backdrop-blur-md p-8 rounded-3xl border border-white/15 text-center max-w-md w-full shadow-2xl">
    <div class="w-12 h-12 rounded-2xl bg-gold/20 flex items-center justify-center text-gold font-bold mx-auto mb-4 animate-spin">
      WSU
    </div>
    <h2 class="text-xl font-bold mb-2">Redirecting to Your LMS Portal...</h2>
    <p class="text-xs text-gray-300 mb-6">Checking credentials and loading your role dashboard.</p>
    
    <div class="space-y-2">
      <a href="student-dashboard.html" class="block w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition">
        Student Dashboard
      </a>
      <a href="lecturer-dashboard.html" class="block w-full py-2.5 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-bold transition">
        Lecturer Dashboard
      </a>
    </div>
  </div>
</body>
</html>
